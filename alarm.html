<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alarm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body class="ring-page">
  <main role="alertdialog" aria-labelledby="ring-title" aria-describedby="ring-time ring-msg" class="ring-card">
    <p id="ring-time" class="ring-time"></p>
    <h1 id="ring-title" class="ring-title"></h1>
    <p id="ring-msg" class="ring-msg"></p>

    <form id="ring-form" class="ring-form" autocomplete="off">
      <div id="challenge" hidden>
        <label for="ring-answer" id="ring-question"></label>
        <input id="ring-answer" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
        <p id="ring-error" class="error" role="alert"></p>
      </div>
      <div class="ring-actions">
        <button type="submit" id="btn-dismiss" class="primary big"></button>
        <button type="button" id="btn-snooze" class="big"></button>
      </div>
    </form>
  </main>
  <div id="live" class="sr-only" role="status" aria-live="polite"></div>
  <script type="module" src="alarm.js"></script>
</body>
</html>
